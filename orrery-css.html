<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니테코톡</title>
<link rel="preload" href="fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Galmuri11;font-style:normal;font-weight:400;font-display:swap;
  src:local('Galmuri11 Regular'), url('fonts/Galmuri11.woff2') format('woff2');}
</style>

<!-- ============================================================
     여기만 고치면 됩니다.

     CREW  : 스터디원 = 천체.
       kind  moon   달    작고 회색, 크레이터, 점선 궤도
             rock   화성  붉은 기, 극지방 만년설
             bands  목성  크고 가로 띠, 대적점
             ring   토성  기울어진 고리
             ice    천왕성 청록색, 세로 고리
             comet  혜성  아주 작고, 바깥쪽으로 꼬리

     SESSIONS : 배열 순서대로 안쪽 궤도부터 바깥으로 배치됩니다.
                youtube는 영상 URL의 v= 뒤 11글자. 없으면 null.
                focus는 원형으로 자를 때 남길 위치. top / center / bottom.
     ============================================================ -->
<script>
const CREW = {
  "수양": { body: "달",   kind: "moon",  c1: "#D8D3C9", c2: "#898277" },
  "두호": { body: "화성", kind: "rock",  c1: "#D2603F", c2: "#72281A" },
  "윤중": { body: "목성", kind: "bands", c1: "#E2B375", c2: "#8E6234" },
};

const SESSIONS = [
  { no: 1,  date: "2026-03-12", title: "오브젝트 1~4장: 객체지향 설계 입문", presenter: "수양", runtime: "48:20", focus: "center", youtube: "dQw4w9WgXcQ" },
  { no: 2,  date: "2026-03-19", title: "트랜잭션 격리 수준과 락 전략",        presenter: "두호", runtime: "52:04", focus: "center", youtube: null },
  { no: 3,  date: "2026-03-26", title: "분산 트랜잭션: 2PC, Saga, TCC",       presenter: "수양", runtime: "61:37", focus: "center", youtube: null },
  { no: 4,  date: "2026-04-02", title: "MySQL 인덱스와 실행 계획 읽기",       presenter: "윤중", runtime: "44:11", focus: "center", youtube: null },
  { no: 5,  date: "2026-04-09", title: "멱등성 있는 API 설계",                presenter: "수양", runtime: "39:52", focus: "center", youtube: null },
  { no: 6,  date: "2026-04-16", title: "재고 정합성: 음수 재고를 막는 방법",   presenter: "두호", runtime: "55:18", focus: "center", youtube: null },
  { no: 7,  date: "2026-04-23", title: "유니코드와 MySQL 인코딩",             presenter: "윤중", runtime: "35:40", focus: "center", youtube: null },
  { no: 8,  date: "2026-04-30", title: "레이트 리미팅: 토큰 버킷과 리키 버킷", presenter: "수양", runtime: "41:05", focus: "center", youtube: null },
  { no: 9,  date: "2026-05-14", title: "HTTP 캐싱: Cache-Control과 ETag",     presenter: "두호", runtime: "46:29", focus: "center", youtube: null },
  { no: 10, date: "2026-05-21", title: "피처 플래그 시스템 설계",             presenter: "수양", runtime: "50:13", focus: "center", youtube: null },
  { no: 11, date: "2026-05-28", title: "카프카 기초와 메시지 순서 보장",       presenter: "윤중", runtime: "58:44", focus: "center", youtube: null },
  { no: 12, date: "2026-06-04", title: "배치 잡 설계와 재실행 안전성",         presenter: "두호", runtime: "43:56", focus: "center", youtube: null },
  { no: 13, date: "2026-09-03", title: "옵저버빌리티: 로그, 메트릭, 트레이싱", presenter: "윤중", runtime: null,   focus: "center", youtube: null },
  { no: 14, date: "2026-09-10", title: "온콜 회고: 장애에서 배운 것",          presenter: "수양", runtime: null,   focus: "center", youtube: null },
];
</script>

<style>
:root{
  --deep:#070A1A; --panel:#0E1330; --panel-2:#161D42;
  --edge:rgba(143,182,217,.16);
  --amber:#F0A93B; --ice:#8FB6D9; --paper:#E9EEF9; --dim:#5C6C90;
  --canvas:960px;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--deep);color:var(--paper);overflow:hidden;
  display:flex;flex-direction:column;
  font-family:"Galmuri11",ui-monospace,monospace;font-size:15px;line-height:1.6}

.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(48% 40% at 50% 46%, rgba(240,169,59,.14), transparent 66%),
    radial-gradient(52% 40% at 88% 8%, rgba(104,74,196,.17), transparent 72%),
    radial-gradient(60% 46% at 6% 88%, rgba(20,90,150,.15), transparent 74%)}
.star{position:absolute;border-radius:50%;background:#fff}

/* ---------- 무대 ---------- */
.scene{position:relative;z-index:1;flex:1;display:grid;place-items:center;min-height:0}
.orrery{position:relative;width:min(94vw,76vh,980px);aspect-ratio:1}
.stage{position:absolute;left:50%;top:50%;width:var(--canvas);height:var(--canvas);
  transform:translate(-50%,-50%) scale(var(--k,1))}

.sun{position:absolute;left:50%;top:50%;width:var(--sun);height:var(--sun);
  margin-left:calc(var(--sun) / -2);margin-top:calc(var(--sun) / -2);
  border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(circle at 42% 38%,#FFE7BC,var(--amber) 44%,#B95E1B 80%,#5E2708 100%);
  box-shadow:0 0 100px -6px rgba(240,169,59,.6),0 0 260px 24px rgba(240,169,59,.13)}
.sun .n{font-family:"Galmuri11",ui-monospace,monospace;font-weight:700;font-size:30px;line-height:1;color:#2A1403}
.sun .l{font-family:"Galmuri11",ui-monospace,monospace;font-size:9px;letter-spacing:.2em;
  color:rgba(42,20,3,.7);margin-top:6px}

/* ---------- 궤도 ---------- */
.orbit{position:absolute;left:50%;top:50%;
  width:calc(var(--r) * 2);height:calc(var(--r) * 2);
  margin-left:calc(var(--r) * -1);margin-top:calc(var(--r) * -1);
  animation:expand .9s cubic-bezier(.2,.7,.3,1) both;
  animation-delay:calc(var(--i) * 85ms)}
@keyframes expand{from{transform:scale(.06);opacity:0}to{transform:scale(1);opacity:1}}

.ring{position:absolute;inset:0;border-radius:50%;
  border:1px dashed rgba(143,182,217,.2);transition:border-color .5s,box-shadow .5s}
.orbit.recv .ring{border-style:solid;border-color:rgba(240,169,59,.42);
  box-shadow:0 0 22px -8px rgba(240,169,59,.5),inset 0 0 22px -8px rgba(240,169,59,.32)}

.arm{position:absolute;inset:0;animation:spin var(--dur) linear infinite;
  animation-delay:calc(var(--dur) * -1 * var(--phase))}
.pod{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.counter{display:block;animation:spin var(--dur) linear infinite reverse;
  animation-delay:calc(var(--dur) * -1 * var(--phase))}
@keyframes spin{to{transform:rotate(360deg)}}
.stage.hold .arm,.stage.hold .counter{animation-play-state:paused}

/* 혜성 꼬리는 pod 좌표계 — 항상 바깥쪽을 향함 */
.tail{position:absolute;left:50%;bottom:50%;pointer-events:none;
  width:calc(var(--sz) * .62);height:calc(var(--sz) * 3.4);
  transform:translateX(-50%);border-radius:50% 50% 40% 40%;
  background:linear-gradient(0deg,rgba(180,225,255,0),rgba(196,232,255,.5));
  filter:blur(3px)}

/* ---------- 행성 ---------- */
/* 버튼은 구체보다 크게 — 작은 행성도 누를 수 있도록 */
.planet{position:relative;display:grid;place-items:center;padding:0;border:0;background:none;
  width:calc(var(--sz) + 22px);height:calc(var(--sz) + 22px);cursor:pointer;
  touch-action:manipulation;transition:transform .25s}
.planet:hover,.planet:focus-visible{transform:scale(1.5);z-index:6}
.planet:focus-visible{outline:2px solid var(--amber);outline-offset:0;border-radius:50%}

.globe{position:relative;width:var(--sz);height:var(--sz);border-radius:50%;overflow:hidden;
  background:var(--panel);box-shadow:0 0 22px -4px var(--c1),0 0 0 1px rgba(233,238,249,.16);
  transition:box-shadow .25s}
.planet:hover .globe{box-shadow:0 0 36px -2px var(--c1),0 0 0 1px rgba(233,238,249,.5)}

.globe img{position:absolute;inset:0;width:100%;height:100%;display:block;
  object-fit:cover;object-position:center var(--focus,center);
  filter:grayscale(1) sepia(.32) hue-rotate(172deg) saturate(2.4) brightness(.6) contrast(1.14);
  transition:filter .9s ease}

/* 수신 완료 시 천체별 색조 */
.orbit.recv .globe.moon  img{filter:saturate(.4) contrast(1.08) brightness(.95)}
.orbit.recv .globe.rock  img{filter:sepia(.34) saturate(1.55) hue-rotate(-14deg) brightness(.92)}
.orbit.recv .globe.bands img{filter:sepia(.2) saturate(1.25) brightness(1.02)}
.orbit.recv .globe.ring  img{filter:sepia(.26) saturate(1.1) brightness(1)}
.orbit.recv .globe.ice   img{filter:hue-rotate(158deg) saturate(1.3) brightness(1)}
.orbit.recv .globe.comet img{filter:saturate(.5) brightness(1.15)}

.shade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.2) 0 10%,transparent 46%),
    radial-gradient(circle at 33% 29%,transparent 24%,rgba(4,6,18,.44) 70%,rgba(2,3,10,.92) 100%)}

/* 표면 무늬 */
.surface{position:absolute;inset:0;pointer-events:none}
.surface.moon{opacity:.78;mix-blend-mode:multiply;
  background:
    radial-gradient(circle at 62% 27%,rgba(0,0,0,.55) 0 13%,transparent 14%),
    radial-gradient(circle at 35% 59%,rgba(0,0,0,.45) 0 9%,transparent 10%),
    radial-gradient(circle at 55% 76%,rgba(0,0,0,.4) 0 6%,transparent 7%),
    radial-gradient(circle at 24% 36%,rgba(0,0,0,.32) 0 5%,transparent 6%)}
.surface.rock{opacity:.72;mix-blend-mode:screen;
  background:
    radial-gradient(ellipse 44% 15% at 50% 1%,rgba(255,255,255,.78),transparent 72%),
    radial-gradient(ellipse 34% 11% at 50% 99%,rgba(255,255,255,.55),transparent 72%)}
.surface.bands{opacity:.62;mix-blend-mode:overlay;
  background:
    radial-gradient(ellipse 22% 12% at 68% 62%,rgba(206,74,44,.9),rgba(206,74,44,0) 74%),
    repeating-linear-gradient(177deg,rgba(0,0,0,.45) 0 4px,transparent 4px 9px,
      rgba(255,255,255,.32) 9px 13px,transparent 13px 19px)}
.surface.ring{opacity:.42;mix-blend-mode:overlay;
  background:repeating-linear-gradient(176deg,rgba(0,0,0,.3) 0 5px,transparent 5px 12px)}
.surface.ice{opacity:.5;mix-blend-mode:screen;
  background:linear-gradient(122deg,rgba(150,232,255,.6),transparent 58%)}
.surface.comet{opacity:.55;mix-blend-mode:screen;
  background:radial-gradient(circle at 42% 38%,rgba(220,244,255,.8),transparent 62%)}

/* 고리 / 위성 궤도 — 구체 바깥이라 버튼 레벨에 배치 */
.halo{position:absolute;left:50%;top:50%;pointer-events:none;
  width:var(--sz);height:var(--sz);margin-left:calc(var(--sz) / -2);margin-top:calc(var(--sz) / -2)}
.halo.moon::after{content:"";position:absolute;inset:-32%;border-radius:50%;
  border:1px dashed rgba(216,211,201,.42)}
.halo.ring::before,.halo.ring::after{content:"";position:absolute;left:-44%;right:-44%;
  border:1px solid var(--c1);border-radius:50%;transform:rotate(-17deg)}
.halo.ring::before{top:38%;height:36%;opacity:.85}
.halo.ring::after{top:45%;height:22%;opacity:.45}
.halo.ice::after{content:"";position:absolute;left:42%;right:42%;top:-34%;bottom:-34%;
  border:1px solid var(--c1);border-radius:50%;opacity:.5;transform:rotate(8deg)}

/* 링크 없는 회차 */
.globe.void{background:radial-gradient(circle at 33% 28%,var(--panel-2),var(--deep) 76%);
  box-shadow:0 0 0 1px rgba(143,182,217,.22),inset -4px -5px 10px rgba(3,5,16,.7)}

/* ---------- 판독 라인 ---------- */
.readout{position:relative;z-index:1;height:74px;flex:none;display:grid;place-content:center;
  text-align:center;padding:0 18px 14px}
.readout .t{font-size:14px;font-weight:600;color:var(--paper)}
.readout .s{font-size:12px;color:var(--dim);margin-top:2px}
.readout .ep{font-family:"Galmuri11",ui-monospace,monospace;color:var(--amber);letter-spacing:.14em;margin-right:8px}
.readout.idle .t{color:var(--dim);font-weight:400;font-size:13px}

.hold-btn{position:fixed;top:16px;right:16px;z-index:3;font:500 11px/1 inherit;
  padding:8px 12px;border-radius:999px;cursor:pointer;
  background:rgba(14,19,48,.7);border:1px solid var(--edge);color:var(--dim);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:border-color .2s,color .2s}
.hold-btn:hover{border-color:var(--ice);color:var(--paper)}
.hold-btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}

[hidden]{display:none !important}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px}
.scrim{position:absolute;inset:0;background:rgba(3,5,14,.8);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);animation:fade .25s both}
.sheet{position:relative;width:min(620px,100%);max-height:88vh;overflow:auto;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--edge);border-radius:16px;padding:16px;
  box-shadow:0 40px 90px -30px #000;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.x{position:absolute;top:14px;right:14px;z-index:3;width:32px;height:32px;border-radius:50%;
  cursor:pointer;background:rgba(7,10,26,.72);border:1px solid var(--edge);color:var(--paper);
  font-size:15px;line-height:1;display:grid;place-items:center}
.x:hover{border-color:var(--paper)}

.mstage{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  background:var(--deep);box-shadow:0 0 0 1px var(--edge)}
.mstage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mstage img.raw{filter:grayscale(1) sepia(.32) hue-rotate(172deg) saturate(2.4) brightness(.62) contrast(1.14)}
.mstage img.color{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.4,0,.2,1)}
.mstage.recv img.color{clip-path:inset(0)}
.mstage .beam{position:absolute;left:0;right:0;height:2px;top:0;opacity:0;
  background:linear-gradient(90deg,transparent,var(--amber),transparent);
  box-shadow:0 0 14px 2px rgba(240,169,59,.6)}
.mstage.downlinking .beam{animation:sweep 1.1s cubic-bezier(.4,0,.2,1)}
@keyframes sweep{from{top:0;opacity:1}to{top:100%;opacity:0}}
.mstage .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:rgba(7,10,26,.55);border:1px solid rgba(233,238,249,.42);
  transition:transform .25s,background .25s}
.mstage .play:hover{transform:translate(-50%,-50%) scale(1.1);background:rgba(240,169,59,.92);border-color:var(--amber)}
.mstage .play:hover svg{fill:var(--deep)}
.mstage .play svg{width:19px;height:19px;fill:var(--paper);margin-left:3px}
.mstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mstage .none{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;
  gap:6px;text-align:center}
.mstage .none .g{font-family:"Galmuri11",ui-monospace,monospace;font-weight:700;font-size:52px;line-height:1;
  color:rgba(143,182,217,.16)}
.mstage .none .s{font-family:"Galmuri11",ui-monospace,monospace;font-size:10px;letter-spacing:.18em;color:var(--dim)}

.sheet .ep{display:block;margin:18px 0 8px;font-family:"Galmuri11",ui-monospace,monospace;font-size:11px;
  font-weight:700;letter-spacing:.18em;color:var(--dim)}
.sheet h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em;word-break:keep-all;line-height:1.35}
.sheet .meta{margin:10px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim)}
.sheet .meta .who{color:var(--ice);font-weight:500}
.out{color:var(--dim);text-decoration:none;border-bottom:1px solid rgba(92,108,144,.6)}
.out:hover{color:var(--amber);border-color:var(--amber)}
.recvbtn{margin-top:18px;display:inline-flex;align-items:center;gap:7px;padding:10px 16px;
  border-radius:999px;cursor:pointer;font:500 12px/1 inherit;background:transparent;
  border:1px solid var(--edge);color:var(--dim);transition:background .2s,border-color .2s,color .2s}
.recvbtn:hover{border-color:var(--ice);color:var(--paper)}
.recvbtn.on{background:rgba(240,169,59,.14);border-color:var(--amber);color:var(--amber)}
.recvbtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6}

@media (max-width:640px){
  .orrery{width:min(96vw,68vh)}
  .readout{height:82px}
}
@media (prefers-reduced-motion:reduce){
  .orbit{animation:none}
  .arm,.counter{animation:none}
  .arm{transform:rotate(var(--a))}
  .counter{transform:rotate(calc(var(--a) * -1))}
  .scrim,.sheet{animation:none}
  .mstage img.color{transition:none}
}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<button class="hold-btn" id="holdBtn" type="button" aria-pressed="false">궤도 정지</button>

<div class="scene">
  <div class="orrery" id="orrery">
    <div class="stage" id="stage"></div>
  </div>
</div>
<p class="readout idle" id="readout"></p>

<div class="modal" id="modal" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="x" type="button" data-close aria-label="닫기">✕</button>
    <div class="mstage" id="mStage"></div>
    <span class="ep" id="mEp"></span>
    <h2 id="mTitle"></h2>
    <p class="meta" id="mMeta"></p>
    <button class="recvbtn" id="mRecv" type="button"></button>
  </div>
</div>

<script>
(function(){
  const KEY = "study-voyage-recv";
  let mem = [];
  const store = {
    read(){ try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }
            catch { return new Set(mem); } },
    write(s){ mem = [...s]; try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch {} }
  };
  let recv = store.read();
  let frozen = false, lastFocus = null;

  const $ = id => document.getElementById(id);
  const stage = $("stage"), readout = $("readout"), modal = $("modal");
  const FALLBACK = { body:"미지의 천체", kind:"rock", c1:"#8FB6D9", c2:"#2C3A63" };
  const crewOf = n => CREW[n] || FALLBACK;
  const byNo = no => SESSIONS.find(s => s.no === no);
  const isSoon = s => !s.youtube && new Date(s.date) > new Date();
  const fmt = d => d.replace(/-/g, ".");
  const pad = n => String(n).padStart(2, "0");
  const thumb = (id, size) => `https://img.youtube.com/vi/${id}/${size}.jpg`;

  /* 천체 종류별 상대 크기 */
  const SCALE = { moon:.74, rock:.92, bands:1.34, ring:1.06, ice:1.0, comet:.6 };

  (function stars(){
    const sky = $("sky");
    let seed = 20260827;
    const rnd = () => (seed = seed * 1103515245 + 12345, ((seed >>> 16) & 0x7fff) / 0x7fff);
    for (let i = 0; i < 220; i++) {
      const d = document.createElement("div");
      const sz = rnd() < .87 ? 1 : 2;
      d.className = "star";
      d.style.cssText = `left:${(rnd()*100).toFixed(2)}%;top:${(rnd()*100).toFixed(2)}%;
        width:${sz}px;height:${sz}px;opacity:${(.15+rnd()*.7).toFixed(2)}`;
      sky.append(d);
    }
  })();

  /* ---------- 궤도 기하 ---------- */
  const CANVAS = 960, R0 = 118, RMAX = 452;
  const N = SESSIONS.length;
  const STEP = N > 1 ? (RMAX - R0) / (N - 1) : 0;
  const BASE = Math.max(15, Math.min(32, STEP * 0.95));
  const SUN = Math.min(118, R0 - 36) * 2;

  function build(){
    stage.innerHTML = `<div class="sun"><span class="n" id="sunN"></span><span class="l">수신</span></div>`;
    stage.style.setProperty("--sun", SUN + "px");

    SESSIONS.forEach((s, i) => {
      const crew = crewOf(s.presenter);
      const kind = SCALE[crew.kind] ? crew.kind : "rock";
      const angle = (i * 137.5) % 360;
      const sz = BASE * SCALE[kind];

      const orbit = document.createElement("div");
      orbit.className = "orbit" + (recv.has(s.no) ? " recv" : "");
      orbit.dataset.no = s.no;
      orbit.style.cssText = `--r:${(R0 + STEP * i).toFixed(1)}px;--i:${i};
        --dur:${(30 + i * 4.5).toFixed(1)}s;--phase:${(angle/360).toFixed(4)};
        --a:${angle.toFixed(1)}deg;--sz:${sz.toFixed(1)}px;
        --c1:${crew.c1};--c2:${crew.c2};--focus:${s.focus || "center"}`;
      orbit.innerHTML = `<div class="ring"></div>`;

      const planet = document.createElement("button");
      planet.type = "button";
      planet.className = "planet";
      planet.setAttribute("aria-label", `${s.no}회차 ${s.title}, ${s.presenter}`);

      const globe = document.createElement("span");
      globe.className = `globe ${kind}` + (s.youtube ? "" : " void");
      if (s.youtube) {
        const img = document.createElement("img");
        img.loading = "lazy"; img.alt = ""; img.src = thumb(s.youtube, "mqdefault");
        img.addEventListener("error", () => { globe.classList.add("void"); img.remove(); });
        globe.append(img);
        globe.insertAdjacentHTML("beforeend", `<span class="surface ${kind}"></span>`);
      }
      globe.insertAdjacentHTML("beforeend", `<span class="shade"></span>`);

      planet.append(globe);
      planet.insertAdjacentHTML("beforeend", `<span class="halo ${kind}"></span>`);
      planet.addEventListener("click", () => open(s.no));
      const show = () => setReadout(s);
      planet.addEventListener("mouseenter", show);
      planet.addEventListener("focus", show);

      const arm = document.createElement("div"); arm.className = "arm";
      const pod = document.createElement("div"); pod.className = "pod";
      const counter = document.createElement("span"); counter.className = "counter";
      counter.append(planet);
      if (kind === "comet") pod.insertAdjacentHTML("afterbegin", `<span class="tail"></span>`);
      pod.append(counter);
      arm.append(pod);
      orbit.append(arm);
      stage.append(orbit);
    });
  }

  function setReadout(s){
    if (!s) {
      readout.className = "readout idle";
      readout.innerHTML = `<span class="t">행성을 누르면 그 회차 녹화가 열립니다</span>`;
      return;
    }
    readout.className = "readout";
    readout.innerHTML = `<span class="t"><span class="ep">EP${pad(s.no)}</span>${s.title}</span>
      <span class="s">${s.presenter} · ${fmt(s.date)}${s.runtime ? " · " + s.runtime : ""}</span>`;
  }

  function fit(){
    stage.style.setProperty("--k", ($("orrery").clientWidth / CANVAS).toFixed(4));
  }
  if ("ResizeObserver" in window) new ResizeObserver(fit).observe($("orrery"));
  window.addEventListener("resize", fit);

  /* 커서가 들어오면 공전 정지 — 움직이는 표적은 클릭할 수 없으므로 */
  const orrery = $("orrery");
  orrery.addEventListener("pointerenter", () => stage.classList.add("hold"));
  orrery.addEventListener("pointerleave", () => {
    if (!frozen) { stage.classList.remove("hold"); setReadout(null); }
  });
  orrery.addEventListener("focusin", () => stage.classList.add("hold"));

  $("holdBtn").addEventListener("click", e => {
    frozen = !frozen;
    stage.classList.toggle("hold", frozen);
    e.currentTarget.setAttribute("aria-pressed", String(frozen));
    e.currentTarget.textContent = frozen ? "궤도 재개" : "궤도 정지";
  });

  /* ---------- 모달 ---------- */
  function open(no){
    const s = byNo(no);
    if (!s) return;
    const c = crewOf(s.presenter);
    lastFocus = document.activeElement;

    const ms = $("mStage");
    ms.className = "mstage" + (recv.has(no) ? " recv" : "");
    ms.dataset.no = no;
    if (s.youtube) {
      const hi = thumb(s.youtube, "maxresdefault"), lo = thumb(s.youtube, "mqdefault");
      ms.innerHTML = `
        <img class="raw" alt="" src="${hi}" onerror="this.onerror=null;this.src='${lo}'">
        <img class="color" alt="" src="${hi}" onerror="this.onerror=null;this.src='${lo}'">
        <span class="beam"></span>
        <button class="play" type="button" aria-label="재생">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>`;
      ms.querySelector(".play").addEventListener("click", () => {
        ms.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${s.youtube}?autoplay=1&rel=0"
          title="${s.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"
          allowfullscreen></iframe>`;
        if (!recv.has(no)) toggle(no);
      });
    } else {
      ms.innerHTML = `<span class="none"><span class="g">${pad(s.no)}</span>
        <span class="s">${isSoon(s) ? "예정된 통과 지점" : "신호 없음"}</span></span>`;
    }

    $("mEp").textContent = `EP${pad(s.no)} · ${fmt(s.date)}${s.runtime ? " · " + s.runtime : ""}`;
    $("mTitle").textContent = s.title;
    $("mMeta").innerHTML = `<span class="who">${s.presenter} · ${c.body}</span>` +
      (s.youtube ? `<a class="out" href="https://youtu.be/${s.youtube}" target="_blank" rel="noopener">유튜브에서 열기</a>` : "");

    const btn = $("mRecv");
    btn.hidden = !s.youtube;
    btn.dataset.no = no;
    syncBtn(btn, recv.has(no));

    modal.hidden = false;
    document.documentElement.style.overflow = "hidden";
    modal.querySelector(".x").focus();
  }

  function close(){
    modal.hidden = true;
    $("mStage").innerHTML = "";
    document.documentElement.style.overflow = "";
    lastFocus?.focus?.();
  }
  modal.addEventListener("click", e => { if (e.target.dataset.close !== undefined) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) close(); });

  function syncBtn(b, on){
    b.className = "recvbtn" + (on ? " on" : "");
    b.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>
      <span>${on ? "수신 완료" : "봤다고 표시"}</span>`;
    b.setAttribute("aria-pressed", String(on));
  }
  $("mRecv").addEventListener("click", e => toggle(Number(e.currentTarget.dataset.no)));

  function toggle(no){
    const on = !recv.has(no);
    on ? recv.add(no) : recv.delete(no);
    store.write(recv);

    stage.querySelector(`.orbit[data-no="${no}"]`)?.classList.toggle("recv", on);

    const ms = $("mStage");
    if (ms.dataset.no == no) {
      ms.classList.toggle("recv", on);
      if (on) {
        ms.classList.add("downlinking");
        setTimeout(() => ms.classList.remove("downlinking"), 1100);
      }
    }
    const btn = $("mRecv");
    if (btn.dataset.no == no) syncBtn(btn, on);
    renderCount();
  }

  function renderCount(){
    const done = SESSIONS.filter(s => recv.has(s.no)).length;
    const n = $("sunN");
    if (n) n.textContent = `${done}/${SESSIONS.length}`;
  }

  build(); renderCount(); setReadout(null); fit();
})();
</script>
</body>
</html>
