<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니테코톡</title>
<meta name="description" content="미니테코톡 회차별 발표 녹화 아카이브">

<link rel="preload" href="fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* Galmuri11. 한글 11,172자를 담은 픽셀 폰트로 파일이 500KB이므로 한 종류만 쓴다.
   비트맵에서 온 폰트라 설계 크기 12px과 그 배수(24px)에서만 픽셀이 정확히 맞는다.
   Copyright 2019-2025 Lee Minseo, SIL OFL 1.1 (fonts/Galmuri-OFL.md) */
@font-face{
  font-family:Galmuri11;
  font-style:normal;font-weight:400;font-display:swap;
  src:local('Galmuri11 Regular'), url('fonts/Galmuri11.woff2') format('woff2');
}

:root{
  --deep:#05070F;
  /* CRT 패널: 밝은 파란 인광 */
  --panel-hi:#14559A;
  --panel-mid:#0A2E5C;
  --panel-lo:#061630;
  /* 네온 라임 */
  --lime:#B8FF3A;
  --lime-2:#93E524;
  --lime-dim:#6B9E2E;
  --paper:#E4FFC0;

  --f:"Galmuri11",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--lime);overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  font-family:var(--f);font-size:12px;line-height:1.8;
  -webkit-font-smoothing:none;font-smooth:never;   /* 픽셀 폰트는 안티앨리어싱을 끈다 */
  text-rendering:geometricPrecision}

#gl{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#gl.grabbing{cursor:grabbing}
#gl.pick{cursor:pointer}

.hud{position:fixed;z-index:2;pointer-events:none}
.hud.tr{top:16px;right:16px;display:flex;gap:8px;align-items:center}
.hud.bl{left:20px;bottom:20px;display:flex;gap:22px;align-items:flex-end}
.hud.bc{left:0;right:0;bottom:0;padding:0 18px 24px;text-align:center}

.hint{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--lime-dim)}
.hint svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.hint svg .solid{fill:currentColor;stroke-width:1}
.hint span{font-family:var(--f);font-size:12px;line-height:1;color:var(--lime-dim)}

/* 계기 패널: 각진 테두리, 불투명 배경, 스위치마다 LED */
.rack{pointer-events:auto;display:flex;background:#07162C;
  border:1px solid var(--lime-dim);box-shadow:0 2px 0 rgba(0,0,0,.5)}
.ctl{display:flex;align-items:center;gap:8px;
  font-family:var(--f);font-size:12px;line-height:1;
  padding:9px 12px;cursor:pointer;
  background:none;border:0;border-radius:0;color:var(--lime-dim);
  transition:color .12s,background .12s}
.ctl + .ctl{border-left:1px solid rgba(107,158,46,.5)}
.ctl:hover{color:var(--lime);background:rgba(184,255,58,.07)}
.ctl:focus-visible{outline:1px solid var(--lime);outline-offset:-3px}
/* 켜짐 여부는 LED로만 알린다. 버튼 전체가 빛나면 눌린 건지 알 수 없다. */
.ctl .led{flex:none;width:6px;height:6px;background:#0B2417;
  border:1px solid rgba(107,158,46,.75)}
.ctl[aria-pressed="true"]{color:var(--lime)}
.ctl[aria-pressed="true"] .led{background:var(--lime);border-color:var(--lime);
  box-shadow:0 0 7px rgba(184,255,58,.9)}
.ctl svg{flex:none;width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}

.readout{min-height:66px;margin:0}
.readout .t{display:block;font-family:var(--f);font-size:24px;line-height:1.4;color:var(--paper);
  text-shadow:0 0 8px rgba(184,255,58,.55),0 0 20px rgba(184,255,58,.2)}
.readout .s{display:block;font-family:var(--f);font-size:12px;line-height:1.6;
  color:var(--lime-dim);margin-top:4px}
.readout .ep{color:var(--lime);margin-right:8px}

@media (max-width:680px){
  .hud.bc{padding-bottom:96px}
  .hud.bl{left:14px;bottom:16px;gap:16px}
  .readout .t{font-size:12px;line-height:1.6}
  .readout{min-height:52px}
  .hint svg{width:28px;height:28px}
}

/* 손가락 입력 기기: 마우스 아이콘을 터치 아이콘으로 바꾼다 */
.hint.touch-only{display:none}
@media (hover:none){
  .hint.mouse-only{display:none}
  .hint.touch-only{display:flex}
}

/* ---------- 로딩 ---------- */
#boot{position:fixed;inset:0;z-index:9;display:grid;place-content:center;justify-items:center;
  gap:18px;text-align:center;padding:24px;background:var(--deep)}
#boot .ship{width:44px;height:44px;fill:none;stroke:var(--lime);stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 10px rgba(184,255,58,.6));
  animation:bob 2.4s ease-in-out infinite}
#boot .ship .flame{stroke:var(--lime-2);animation:flame .4s steps(2) infinite}
@keyframes bob{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
@keyframes flame{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
#boot .m{font-family:var(--f);font-size:12px;line-height:1.7;color:var(--paper);max-width:40ch;
  text-shadow:0 0 8px rgba(184,255,58,.5)}
#boot .dots i{font-style:normal;animation:blip 1.4s steps(1) infinite}
#boot .dots i:nth-child(2){animation-delay:.35s}
#boot .dots i:nth-child(3){animation-delay:.7s}
@keyframes blip{0%,74%{opacity:0}75%,100%{opacity:1}}
#boot a{color:var(--lime)}
#boot code{font-family:var(--f);font-size:12px;background:rgba(184,255,58,.12);
  padding:2px 6px;color:var(--paper)}

[hidden]{display:none !important}

/* ---------- 상세: 우주 수신기 패널 ---------- */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px}
.scrim{position:absolute;inset:0;background:rgba(2,8,20,.84);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.sheet{position:relative;width:min(600px,100%);max-height:88vh;overflow:auto;
  padding:24px;border-radius:12px;
  border:1px solid rgba(184,255,58,.42);
  background:
    radial-gradient(130% 100% at 50% -12%, rgba(64,158,240,.4), transparent 62%),
    linear-gradient(180deg, var(--panel-hi) 0%, var(--panel-mid) 46%, var(--panel-lo) 100%);
  box-shadow:
    0 0 30px rgba(184,255,58,.18),
    0 0 140px -20px rgba(52,146,236,.65),
    inset 0 0 70px rgba(184,255,58,.06),
    inset 0 0 130px rgba(4,14,34,.6);
  animation:power .35s cubic-bezier(.2,.7,.3,1) both}
/* 전원이 들어오듯 세로로 펼쳐진다 */
@keyframes power{
  0%{opacity:0;transform:scaleY(.02);filter:brightness(2.4)}
  55%{opacity:1;transform:scaleY(1.02);filter:brightness(1.5)}
  100%{opacity:1;transform:scaleY(1);filter:brightness(1)}
}

/* 주사선 + 비네팅 + 미세한 떨림 */
.crt{position:absolute;inset:0;border-radius:12px;pointer-events:none;overflow:hidden;
  background:
    repeating-linear-gradient(180deg, rgba(2,10,24,.26) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 50%, transparent 52%, rgba(2,10,24,.5) 100%);
  animation:flick 7s steps(1) infinite}
@keyframes flick{
  0%,100%{opacity:.9} 12%{opacity:1} 12.6%{opacity:.72} 13%{opacity:.95}
  47%{opacity:.88} 47.4%{opacity:1} 78%{opacity:.93} 78.5%{opacity:.78} 79%{opacity:.92}
}
/* 수신 스캔선이 패널을 천천히 훑는다 */
.crt::after{content:"";position:absolute;left:0;right:0;height:38px;
  background:linear-gradient(180deg, transparent, rgba(184,255,58,.11) 55%, rgba(184,255,58,.02));
  animation:scan 5.5s linear infinite}
@keyframes scan{from{top:-40px}to{top:100%}}

/* 네 귀퉁이 브래킷 */
.corners span{position:absolute;width:12px;height:12px;pointer-events:none;
  border:1px solid rgba(184,255,58,.6)}
.corners span:nth-child(1){top:9px;left:9px;border-right:0;border-bottom:0}
.corners span:nth-child(2){top:9px;right:9px;border-left:0;border-bottom:0}
.corners span:nth-child(3){bottom:9px;left:9px;border-right:0;border-top:0}
.corners span:nth-child(4){bottom:9px;right:9px;border-left:0;border-top:0}

.x{position:absolute;top:16px;right:16px;z-index:4;width:34px;height:34px;border-radius:2px;
  cursor:pointer;background:rgba(4,16,38,.7);border:1px solid rgba(184,255,58,.4);
  display:grid;place-items:center;padding:0}
.x svg{width:16px;height:16px;fill:none;stroke:var(--lime);stroke-width:1.6;stroke-linecap:round}
.x:hover{border-color:var(--lime);box-shadow:0 0 12px rgba(184,255,58,.35)}

.mstage{position:relative;z-index:2;aspect-ratio:16/9;border-radius:4px;overflow:hidden;
  background:#03101f;border:1px solid rgba(184,255,58,.3);
  box-shadow:0 0 22px rgba(184,255,58,.12),inset 0 0 30px rgba(4,14,34,.7)}
.mstage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  filter:contrast(1.06) saturate(1.04)}
/* 썸네일 위에도 같은 주사선을 얹어 한 화면처럼 보이게 한다 */
.mstage .lines{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg, rgba(2,10,24,.3) 0 1px, transparent 1px 3px)}
.mstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mstage .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:66px;height:66px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;
  background:rgba(4,16,38,.6);border:1px solid var(--lime);
  box-shadow:0 0 18px rgba(184,255,58,.4);
  transition:background .15s,box-shadow .15s}
.mstage .play:hover{background:var(--lime);box-shadow:0 0 26px rgba(184,255,58,.7)}
.mstage .play:hover svg{fill:#04101F}
.mstage .play svg{width:22px;height:22px;fill:var(--lime);margin-left:3px;transition:fill .15s}
.mstage .none{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;
  gap:8px;text-align:center}
.mstage .none .g{font-family:var(--f);font-size:24px;line-height:1;color:rgba(184,255,58,.22)}
.mstage .none .s{font-family:var(--f);font-size:12px;letter-spacing:.16em;color:var(--lime-dim)}

.info{position:relative;z-index:2}
.info .ep{display:block;margin:20px 0 8px;font-family:var(--f);font-size:12px;line-height:1;
  letter-spacing:.2em;color:var(--lime);text-shadow:0 0 10px rgba(184,255,58,.6)}
.info h2{margin:0;font-family:var(--f);font-size:24px;line-height:1.5;color:var(--paper);
  word-break:keep-all;text-shadow:0 0 10px rgba(184,255,58,.5),0 0 26px rgba(184,255,58,.2)}
.info .who{margin:10px 0 0;font-family:var(--f);font-size:12px;line-height:1;color:var(--lime-2)}
.info .out{display:inline-block;margin-top:20px;font-family:var(--f);font-size:12px;line-height:1;
  color:var(--lime);text-decoration:none;padding:9px 13px;border-radius:3px;
  border:1px solid rgba(184,255,58,.45);background:rgba(184,255,58,.07);
  transition:background .15s,box-shadow .15s}
.info .out:hover{background:rgba(184,255,58,.16);box-shadow:0 0 16px rgba(184,255,58,.35)}

@media (prefers-reduced-motion:reduce){
  .crt,.crt::after,.sheet,#boot .ship,#boot .ship .flame,#boot .dots i{animation:none}
}
</style>
</head>
<body>

</div>

<div id="boot">
  <svg class="ship" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M16 3c3.2 3.4 5 8 5 13v6h-10v-6c0-5 1.8-9.6 5-13z"/>

<script>
  /* 모듈 스크립트가 아예 실행되지 않는 경우(CDN 차단 등) 안내 */
  window.__booted = false;
  setTimeout(() => {
    if (!window.__booted) {
      document.getElementById("bootMsg").innerHTML =
        "화면을 시작하지 못했습니다. vendor/ 폴더가 함께 올라갔는지 확인해주세요.<br>" +
        `<a href="orrery-css.html">CSS 버전으로 보기</a>`;
    }
  }, 7000);
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/OrbitControls.js";

window.__booted = true;
const $ = id => document.getElementById(id);

/* ============================================================
   1. 데이터
   회차와 스터디원은 data.json에서 읽는다. 이 파일을 고칠 일은 없다.
   ============================================================ */
async function loadData(){
  const r = await fetch("data.json", { cache: "no-cache" });
  if (!r.ok) throw new Error(`data.json HTTP ${r.status}`);
  const d = await r.json();
  if (!Array.isArray(d.sessions) || !d.sessions.length) throw new Error("sessions가 비어 있습니다");
  return d;
}

let DATA;
try {
  DATA = await loadData();
} catch (err) {
  $("bootMsg").innerHTML = location.protocol === "file:"
    ? "브라우저는 <code>file://</code>에서 data.json을 읽을 수 없습니다.<br>" +
      "폴더에서 <code>python3 -m http.server</code> 를 실행하고<br>" +
      "<code>localhost:8000</code> 으로 열어주세요."
    : `data.json을 불러오지 못했습니다.<br><code>${err.message}</code>`;
  throw err;
}

const CREW = DATA.crew || {};
const SESSIONS = DATA.sessions;
const LOOK = Object.assign({ sun: 4.0, ambient: 1.15, unseen: "#B9C8DA" }, DATA.look);

/* ============================================================
   2. 상태
   ============================================================ */
const KEY = "study-voyage-recv";
let mem = [];
const store = {
  read(){ try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }
          catch { return new Set(mem); } },
  write(s){ mem = [...s]; try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch {} }
};
let recv = store.read();
let frozen = false, hovered = null, lastFocus = null, modalOpen = false;
let dirty = true;        // 다음 프레임에 한 번 그려야 하는지

const FALLBACK = { body:"미지의 천체", kind:"mercury", texture:null, glow:"#8FB6D9" };
const crewOf = n => CREW[n] || FALLBACK;
const bySid = sid => SESSIONS[sid];
const isSoon = s => !s.youtube && new Date(s.date) > new Date();
const pad = n => String(n).padStart(2, "0");
const thumbUrl = (id, size) => `https://i.ytimg.com/vi/${id}/${size}.jpg`;

/* 천체 종류.
   size  기준 반지름 배율 (실제 크기는 궤도 간격에 비례해 자동 결정된다)
   tilt  자전축 기울기 (라디안)
   ring  "tilt" 기울어진 고리 / "upright" 거의 수직인 고리 / false
   tail  태양 반대쪽으로 뻗는 꼬리
   atmo  대기광 세기 (0이면 없음)
   crew에서 이 값들을 개별로 덮어쓸 수 있다. */
const KIND = {
  moon:    { size:0.70, tilt:0.12 },
  mercury: { size:0.66, tilt:0.06 },
  venus:   { size:0.88, tilt:0.31, atmo:0.20 },
  earth:   { size:0.94, tilt:0.41, atmo:0.26 },
  mars:    { size:0.80, tilt:0.44 },
  jupiter: { size:1.36, tilt:0.06, atmo:0.12 },
  saturn:  { size:1.18, tilt:0.47, ring:"tilt" },
  uranus:  { size:1.00, tilt:1.50, atmo:0.18 },
  neptune: { size:0.98, tilt:0.52, atmo:0.20 },

};
/* 예전 이름도 계속 받는다 */
const ALIAS = { rock:"mars", bands:"jupiter", ring:"saturn", ice:"uranus" };
const DEFAULTS = { size:0.9, tilt:0.28, ring:false, tail:false, atmo:0 };

function traitsOf(crew){
  const name = ALIAS[crew.kind] || crew.kind;
  const base = KIND[name];
  if (!base && crew.kind) {
    console.warn(`[data.json] 알 수 없는 kind "${crew.kind}" — earth로 대체합니다.`,
                 "쓸 수 있는 값:", Object.keys(KIND).join(", "));
  }
  const t = Object.assign({}, DEFAULTS, base || KIND.earth);
  for (const k of ["size", "tilt", "ring", "tail", "atmo"]) {
    if (crew[k] != null) t[k] = crew[k];      // crew의 개별 지정이 우선
  }
  return t;
}

   4. 공유 자원
   행성마다 지오메트리를 새로 만들면 14개가 각각 GPU 버퍼를 차지한다.
   단위 크기로 하나만 만들고 스케일로 크기를 조절한다.
   ============================================================ */
const GEO = {
  sphere: new THREE.SphereGeometry(1, 48, 32),
  hit:    new THREE.SphereGeometry(1, 10, 6),
  ring:   new THREE.RingGeometry(1.45, 2.35, 56),

/* material.visible = false 는 그리지는 않지만 레이캐스트 대상은 유지된다 */
const HIT_MAT = new THREE.MeshBasicMaterial({ visible: false });

const DIM_OP = .3, LIT_OP = .62;
/* 궤도선 재질은 궤도마다 같으므로 두 개만 만들어 공유한다 */
const LINE_DIM = new THREE.LineDashedMaterial({
  color: 0x6E86AA, transparent: true, opacity: DIM_OP, dashSize: 1.1, gapSize: 1.1 });
const LINE_LIT = new THREE.LineBasicMaterial({
  color: 0xF0A93B, transparent: true, opacity: LIT_OP });

const COL_RECV = new THREE.Color(0xFFFFFF);
const COL_RAW  = new THREE.Color(LOOK.unseen);

const maxAniso = renderer.capabilities.getMaxAnisotropy();
const loader = new THREE.TextureLoader();
const texCache = new Map();
const spriteCache = new Map();

function fallbackTexture(hex){
  const cv = document.createElement("canvas");
  cv.width = 256; cv.height = 128;
  const ctx = cv.getContext("2d");
  const base = new THREE.Color(hex);
  const g = ctx.createLinearGradient(0, 0, 60, 128);
  g.addColorStop(0, `#${base.getHexString()}`);
  g.addColorStop(1, `#${base.clone().multiplyScalar(.45).getHexString()}`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 128);
  for (let i = 0; i < 26; i++) {
    const x = (i * 47.3) % 256, y = (i * 29.7) % 128, r = 6 + (i * 7) % 22;
    const b = ctx.createRadialGradient(x, y, 0, x, y, r);
    b.addColorStop(0, i % 2 ? "rgba(255,255,255,.14)" : "rgba(0,0,0,.2)");
    b.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = b; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* 같은 발표자의 회차는 텍스처 하나를 공유한다.
   14회차라도 GPU에 올라가는 이미지는 스터디원 수만큼이다. */
function surfaceOf(crew){
  const key = crew.texture || `fb:${crew.glow}`;
  if (texCache.has(key)) return texCache.get(key);
  let tex;
  if (crew.texture) {
    tex = loader.load(crew.texture, () => { dirty = true; }, undefined, () => {
      const fb = fallbackTexture(crew.glow);
      tex.image = fb.image; tex.needsUpdate = true; dirty = true;
    });
  } else {
    tex = fallbackTexture(crew.glow);
  }
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(4, maxAniso);
  texCache.set(key, tex);
  return tex;
}

function haloMaterial(glow){
  if (spriteCache.has(glow)) return spriteCache.get(glow);
  const map = glowTexture(glow, .5, "55");
  /* 한 번에 하나만 보이므로 발표자별로 재질 하나를 공유해도 안전하다 */
  const mat = new THREE.SpriteMaterial({
    map, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 });
  spriteCache.set(glow, mat);
  return mat;
}

/* 대기광: 구체 뒤에 깔린 스프라이트가 실루엣 바깥으로만 삐져나와
   행성 테두리가 빛나는 것처럼 보인다. 세기는 kind의 atmo 값. */
const atmoCache = new Map();
function atmoMaterial(glow, strength){
  const key = `${glow}:${strength}`;
  if (atmoCache.has(key)) return atmoCache.get(key);
  const mat = new THREE.SpriteMaterial({
    map: glowTexture(glow, .85, "aa"), blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, opacity: strength });
  atmoCache.set(key, mat);
  return mat;
}

function glowTexture(glow, inner, midAlpha){
  const cv = document.createElement("canvas");
  cv.width = cv.height = 128;
  const ctx = cv.getContext("2d");
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, `rgba(255,255,255,${inner})`);
  g.addColorStop(.45, `${glow}${midAlpha}`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

{

/* ============================================================
   5. 궤도
   ============================================================ */
const R0 = 13, RMAX = 62;
/* 궤도는 회차(no) 하나당 하나다. 같은 회차의 발표는 같은 궤도를
   나눠 쓰며, 궤도 위에서 서로 균등한 각도로 떨어져 돈다. */
const ORBITS = [...new Set(SESSIONS.map(s => s.no))]
  .sort((a, b) => a - b)
  .map(no => ({ no, list: SESSIONS.filter(s => s.no === no) }));
const N = ORBITS.length;
const STEP = N > 1 ? (RMAX - R0) / (N - 1) : 0;
/* 행성 반지름은 궤도 간격에 비례한다. 회차가 늘어 간격이 좁아지면
   행성도 같이 작아져 이웃 궤도를 침범하지 않는다. */
const BASE = Math.min(2.6, Math.max(.5, STEP * .44));

const bodies = [], hitMeshes = [];

ORBITS.forEach((o, i) => {
  const r = R0 + STEP * i;

  const orbit = new THREE.Group();
  orbit.rotation.x = (i % 2 ? 1 : -1) * (0.02 + (i % 5) * 0.012);   // 약한 궤도 경사
  orbit.rotation.z = (i % 3 ? -1 : 1) * (i % 7) * 0.008;
  scene.add(orbit);

  /* 궤도선. 점선 재질은 선분 길이를 필요로 하는데 한 번만 계산하면 된다.
     한 회차에 발표가 여럿이어도 궤도선은 하나다. */
  const pts = [];
  for (let a = 0; a <= 128; a++) {
    const t = a / 128 * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(t) * r, 0, Math.sin(t) * r));
  }
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    recv.has(o.no) ? LINE_LIT : LINE_DIM);
  line.computeLineDistances();
  line.matrixAutoUpdate = false; line.updateMatrix();
  orbit.add(line);

  /* 궤도마다 같은 공전 속도를 쓴다. 같은 회차의 행성들은 간격을
     유지한 채 함께 돈다. */
  const speed = (2 * Math.PI) / (30 + i * 4.5);   // 바깥 궤도가 더 느리다

  o.list.forEach((s, j) => {
    const sid = SESSIONS.indexOf(s);               // 발표 하나를 가리키는 식별자
    const crew = crewOf(s.presenter);
    const t = traitsOf(crew);
    const rad = BASE * t.size;
    /* 황금각으로 궤도끼리 시작 위치를 흩고, 같은 궤도 안에서는
       360/인원 만큼 벌린다 */
    const angle = (i * 137.5 + j * 360 / o.list.length) * Math.PI / 180;

    const pivot = new THREE.Group();               // 매 프레임 회전
    pivot.rotation.y = angle;
    orbit.add(pivot);

    const holder = new THREE.Group();              // 위치 고정
    holder.position.x = r;                         // +X가 항상 태양 반대 방향
    holder.matrixAutoUpdate = false; holder.updateMatrix();
    pivot.add(holder);

    const mat = new THREE.MeshStandardMaterial({
      map: surfaceOf(crew), roughness: .85, metalness: .02,
      color: (recv.has(s.no) ? COL_RECV : COL_RAW).clone() });
    const planet = new THREE.Mesh(GEO.sphere, mat);
    planet.scale.setScalar(rad);
    planet.rotation.z = t.tilt;                    // 자전축 기울기
    holder.add(planet);

    /* 클릭 판정용. 보이는 구체보다 크게 잡아야 작은 천체도 누를 수 있다 */
    const hit = new THREE.Mesh(GEO.hit, HIT_MAT);
    hit.scale.setScalar(Math.max(rad * 1.35, 1.6));
    hit.userData.sid = sid;
    hit.matrixAutoUpdate = false; hit.updateMatrix();
    holder.add(hit);
    hitMeshes.push(hit);

    if (t.ring) {
      const ring = new THREE.Mesh(GEO.ring, new THREE.MeshBasicMaterial({
        color: new THREE.Color(crew.glow), transparent: true, opacity: .42,
        side: THREE.DoubleSide, depthWrite: false }));
      ring.scale.setScalar(rad);
      if (t.ring === "upright") ring.rotation.y = .3;   // 천왕성처럼 거의 수직인 고리
      else ring.rotation.x = Math.PI / 2 - .34;
      ring.matrixAutoUpdate = false; ring.updateMatrix();
      holder.add(ring);
    }
    if (t.tail) {
      const tail = new THREE.Mesh(GEO.tail, new THREE.MeshBasicMaterial({
        color: 0xBFE4FF, transparent: true, opacity: .16,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
      tail.scale.set(rad * 1.5, rad * 11, rad * 1.5);
      tail.rotation.z = -Math.PI / 2;               // +X = 태양 반대 방향
      tail.position.x = rad * 5.5;
      tail.matrixAutoUpdate = false; tail.updateMatrix();
      holder.add(tail);
    }
    if (t.atmo > 0) {
      const atmo = new THREE.Sprite(atmoMaterial(crew.glow, t.atmo));
      atmo.scale.set(rad * 2.9, rad * 2.9, 1);
      holder.add(atmo);
    }

    /* 호버 광휘는 필요할 때만 켠다. 꺼두면 드로우콜에서 아예 빠진다 */
    const halo = new THREE.Sprite(haloMaterial(crew.glow));
    halo.scale.set(rad * 4.6, rad * 4.6, 1);
    halo.visible = false;
    holder.add(halo);

    bodies.push({
      sid, s, crew, rad, orbit, pivot, planet, mat, line, halo,
      speed,
      spin: .12 + ((i + j) % 3) * .05,
      /* 궤도를 펼치는 연출은 궤도 그룹 하나에 걸리므로 대표 한 명만 돌린다 */
      lead: j === 0, delay: i * .09, grow: 0, hoverK: 1, settled: false
    });
  });
});

   7. 입력
   레이캐스트는 pointermove마다 하지 않고 프레임당 한 번만 한다.
   ============================================================ */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let pending = null, downAt = null, dragged = false;

/* 손가락은 마우스만큼 정확하지 않다. 탭할 때는 중심 말고 주변 네 점도
   같이 쏘아서 조금 빗나가도 잡히게 한다. */
const FAT = [[0, 0], [16, 0], [-16, 0], [0, 16], [0, -16]];

function pickAt(x, y, fat){
  for (const [dx, dy] of (fat ? FAT : [[0, 0]])) {
    ptr.x = ((x + dx) / innerWidth) * 2 - 1;
    ptr.y = -((y + dy) / innerHeight) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(hitMeshes, false);
    if (hits.length) return hits[0].object.userData.sid;
  }
  return null;
}

const isTouch = ev => ev.pointerType === "touch" || ev.pointerType === "pen";
/* 터치는 손가락이 크게 흔들리므로 드래그 판정 기준을 넉넉하게 둔다 */
const slop = ev => isTouch(ev) ? 14 : 4;

canvas.addEventListener("pointermove", ev => {
  if (downAt && (Math.abs(ev.clientX - downAt.x) > slop(ev) ||
                 Math.abs(ev.clientY - downAt.y) > slop(ev))) dragged = true;
  /* 터치에는 호버가 없다. 매 이동마다 판정하지 않고 누른 시점에만 본다. */
  if (!isTouch(ev)) pending = { x: ev.clientX, y: ev.clientY };
});

canvas.addEventListener("pointerdown", ev => {
  downAt = { x: ev.clientX, y: ev.clientY };
  dragged = false;
  canvas.classList.add("grabbing");
  /* 손가락을 대는 순간 그 행성을 붙잡는다. 공전이 멈추고 정보가 뜬다. */
  if (isTouch(ev)) setHover(pickAt(ev.clientX, ev.clientY, true));
});

/* 모달은 여기서만 열린다 — 드래그가 아닌 클릭 또는 탭일 때 */
canvas.addEventListener("pointerup", ev => {
  canvas.classList.remove("grabbing");
  const touch = isTouch(ev);
  if (!dragged) {
    const sid = pickAt(ev.clientX, ev.clientY, touch);
    if (sid !== null) open(sid);
    else if (touch) setHover(null);
  } else if (touch) {
    setHover(null);
  }
  downAt = null;
});

canvas.addEventListener("pointercancel", () => {
  canvas.classList.remove("grabbing");
  downAt = null; dragged = false;
});

canvas.addEventListener("pointerleave", ev => {
  canvas.classList.remove("grabbing");
  pending = null;
  if (!isTouch(ev) && hovered !== null) setHover(null);
});

function setHover(sid){
  if (sid === hovered) return;
  const prev = bodies.find(b => b.sid === hovered);
  if (prev) prev.settled = false;
  hovered = sid;
  canvas.classList.toggle("pick", sid !== null);
  setReadout(sid !== null ? bySid(sid) : null);
  const cur = bodies.find(b => b.sid === sid);
  if (cur) cur.settled = false;
  dirty = true;
}

function close(){
  modalOpen = false;

}
$("modal").addEventListener("click", e => { if (e.target.dataset.close !== undefined) close(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalOpen) close(); });

/* 재생하면 수신 완료로 기록한다. 궤도선이 실선으로 바뀌고 행성 색이 살아난다. */
function mark(no){
  if (recv.has(no)) return;
  recv.add(no);
  store.write(recv);
  for (const rec of bodies.filter(b => b.s.no === no)) {
    rec.line.material = LINE_LIT;   // 궤도선은 같은 회차가 공유한다
    rec.mat.emissive.setHex(0x140E04);
    rec.settled = false;
    dirty = true;
  }
}
bodies.forEach(b => {
  if (recv.has(b.s.no)) b.mat.emissive.setHex(0x140E04);
});

/* ============================================================
   9. 루프
   움직일 것이 없으면 그리지 않는다. 공전을 세우고 가만히 두면
   GPU 사용량이 0으로 떨어진다.
   ============================================================ */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  dirty = true;
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) dirty = true; });

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
const ease = t => 1 - Math.pow(1 - t, 3);
let elapsed = 0, booted = false;
let samples = 0, sampleT0 = performance.now(), dprCut = false;

function colorClose(a, b){
  return Math.abs(a.r - b.r) + Math.abs(a.g - b.g) + Math.abs(a.b - b.b) < .004;
}

function frame(){
  requestAnimationFrame(frame);

  /* 탭이 가려져 있거나 모달이 떠 있으면 3D는 쉬게 둔다 */
  if (document.hidden || modalOpen) { clock.getDelta(); return; }

  const dt = Math.min(clock.getDelta(), .05);
  elapsed += dt;
  let active = false;

  if (pending) {                                  // 프레임당 레이캐스트 1회
    setHover(pickAt(pending.x, pending.y, false));
    pending = null;
  }

  const revolve = !reduce && !frozen && hovered === null;
  if (revolve) active = true;

  for (const rec of bodies) {
    if (rec.lead && rec.grow < 1) {                // 안쪽부터 순서대로 펼쳐진다
      rec.grow = Math.max(0, Math.min(1, (elapsed - rec.delay) / .9));
      rec.orbit.scale.setScalar(Math.max(.0001, ease(rec.grow)));
      if (rec.grow >= 1) { rec.orbit.matrixAutoUpdate = false; rec.orbit.updateMatrix(); }
      active = true;
    }
    if (revolve) {
      rec.pivot.rotation.y += rec.speed * dt;
      rec.planet.rotation.y += rec.spin * dt;
    }
    if (!rec.settled) {                            // 호버 확대와 색 전환
      const target = hovered === rec.sid ? 1.32 : 1;
      rec.hoverK += (target - rec.hoverK) * .18;
      const want = recv.has(rec.s.no) ? COL_RECV : COL_RAW;
      rec.mat.color.lerp(want, .1);
      if (Math.abs(rec.hoverK - target) < .002 && colorClose(rec.mat.color, want)) {
        rec.hoverK = target;
        rec.mat.color.copy(want);
        rec.settled = true;
      } else active = true;
      rec.planet.scale.setScalar(rec.rad * rec.hoverK);
      rec.halo.visible = hovered === rec.sid;
      if (rec.halo.visible) rec.halo.material.opacity = Math.min(.55, (rec.hoverK - 1) * 1.8);
    }
  }

  if (flyTo) {
    flyTo.t = Math.min(1, flyTo.t + dt / 1.1);
    camera.position.lerp(flyTo.pos, ease(flyTo.t) * .12 + .04);
    if (flyTo.t >= 1) flyTo = null;
    active = true;
  }

  if (controls.update()) active = true;            // 감쇠가 살아 있는 동안

  if (!active && !dirty) return;                   // 그릴 것이 없다
  renderer.render(scene, camera);
  dirty = false;

  if (!booted && elapsed > .4) { booted = true; $("boot").hidden = true; }

  /* 프레임이 못 따라오면 픽셀 비율을 한 단계 내린다 */
  if (!dprCut && ++samples >= 120) {
    const fps = samples * 1000 / (performance.now() - sampleT0);
    if (fps < 40 && renderer.getPixelRatio() > 1) {
      renderer.setPixelRatio(1);
      dirty = true;
    }
    dprCut = true;
  }
}
frame();
</script>
</body>
</html>
